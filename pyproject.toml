[tool.poetry]
name = "baas-plus"
version = "0.1.0"
description = "基于 BAAS (Blue Archive Auto Script) 的自动化调度器：活动检测、自动推图、按体力扫荡、邮件通知 + WebUI 配置"
authors = ["This-is-XiaoDeng <1744793737@qq.com>"]
license = "AGPL-3.0"
readme = "README.md"
repository = "https://github.com/This-is-XiaoDeng/BAAS-Plus"
packages = [{ include = "baas_plus" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
httpx = "^0.28"
pydantic = "^2.10"

# BAAS 本体（GPL-3.0，仅 Windows 部署时需要；AGPL §13 允许与 GPL-3 作品结合）
# 核心引擎通过惰性导入使用，Linux 开发/测试环境无需安装
blue-archive-auto-script = { git = "https://github.com/pur1fying/blue_archive_auto_script.git", branch = "master", optional = true }

[tool.poetry.extras]
baas = ["blue-archive-auto-script"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
