[tool.poetry]
name = "baas-plus"
version = "1.0.0"
description = "基于 BAAS (Blue Archive Auto Script) 的自动化调度器：活动检测、自动推图、按体力扫荡、邮件通知 + WebUI 配置"
authors = ["This-is-XiaoDeng <1744793737@qq.com>"]
license = "AGPL-3.0"
readme = "README.md"
repository = "https://github.com/This-is-XiaoDeng/BAAS-Plus"
packages = [{ include = "baas_plus" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
httpx = "^0.28"
pydantic = "^2.10"

# BAAS-Plus 是独立库，不内置 BAAS（blue_archive_auto_script）。
# 部署时将其安装进 BAAS 的运行环境（见 README「部署」），
# 从 BAAS 源码根目录运行即可 import core；也可配置 baas.repo_dir 指定 BAAS 源码路径。

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
